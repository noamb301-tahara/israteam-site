<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="images/logo-mark.svg" type="image/svg+xml">
<meta property="og:title" content="IsraTeam 98 Ltd.">
<meta property="og:description" content="Emergency management, civil defense and national resilience consultancy since 1998.">
<meta property="og:image" content="images/deck-cover.jpg">
<meta name="robots" content="noindex">
<title>IsraTeam 98</title>
<meta name="description" content="IsraTeam 98 Ltd. – Israeli consultancy for emergency management, civil defense, national resilience and critical infrastructure protection since 1998.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --ground:#F2F4F3; --surface:#FFFFFF; --sunk:#E8ECEB;
  --ink:#13212A; --ink-2:#46565F; --line:#D3DAD9;
  --deep:#10262E; --deep-ink:#E8EFEE; --deep-2:#A3B6B8; --deep-line:rgba(232,239,238,.14);
  --signal:#B84C14; --signal-ink:#FFFFFF; --teal:#285F6B;
  --wa:#18803F;
  --display:"IBM Plex Sans Condensed","IBM Plex Sans Hebrew","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans","IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0C181D; --surface:#12232A; --sunk:#0F1F25; --ink:#E4ECEB; --ink-2:#A6B6B9; --line:#253A40;
    --deep:#07131A; --deep-ink:#E8EFEE; --deep-2:#93A9AC; --deep-line:rgba(232,239,238,.12);
    --signal:#EE7A3B; --signal-ink:#1A0B03; --teal:#72B3BE; --wa:#3DBB70;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0C181D; --surface:#12232A; --sunk:#0F1F25; --ink:#E4ECEB; --ink-2:#A6B6B9; --line:#253A40;
  --deep:#07131A; --deep-ink:#E8EFEE; --deep-2:#93A9AC; --deep-line:rgba(232,239,238,.12);
  --signal:#EE7A3B; --signal-ink:#1A0B03; --teal:#72B3BE; --wa:#3DBB70;
}
html[lang="he"]{--display:"IBM Plex Sans Hebrew","Arial Hebrew",system-ui,sans-serif;--body:"IBM Plex Sans Hebrew","Arial Hebrew",system-ui,sans-serif}

*{box-sizing:border-box}
html{scroll-padding-top:80px}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:2px}
.wrap{max-width:1160px;margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.12;font-weight:700}
html[lang="he"] h1,html[lang="he"] h2{line-height:1.2}
p{margin:0}
.skip{position:absolute;inset-inline-start:12px;top:-60px;background:var(--signal);color:var(--signal-ink);padding:10px 14px;z-index:50;text-decoration:none;font-weight:600}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);display:flex;align-items:center;gap:10px;font-weight:500}
html[lang="he"] .eyebrow{letter-spacing:.02em;font-family:var(--body);font-weight:600;font-size:13px}
.eyebrow::before{content:"";width:18px;height:2px;background:var(--signal);flex-shrink:0}
.muted{color:var(--ink-2)}
.ltr{direction:ltr;unicode-bidi:isolate}

/* ---------- header ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--deep);color:var(--deep-ink);border-bottom:1px solid var(--deep-line)}
.bar{display:flex;align-items:center;gap:20px;min-height:66px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;flex-shrink:0;direction:ltr}
.brand img{width:38px;height:36px;flex-shrink:0;display:block}
.fcols .brand img{width:42px;height:40px}
.brand .word{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:22px;letter-spacing:.01em;line-height:1}
.brand .word i{font-style:normal;color:var(--signal)}
.brand small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--deep-2);margin-top:3px}
nav.main{display:flex;gap:4px;margin-inline-start:auto}
nav.main a{text-decoration:none;color:var(--deep-2);font-size:14.5px;padding:8px 10px;border-radius:3px;white-space:nowrap}
nav.main a:hover{color:var(--deep-ink)}
nav.main a[aria-current="page"]{color:var(--deep-ink);box-shadow:inset 0 -2px 0 var(--signal)}
.langbtn{background:none;border:1px solid var(--deep-line);color:var(--deep-ink);font:500 13.5px var(--body);padding:7px 12px;border-radius:3px;cursor:pointer;flex-shrink:0}
html[lang="en"] .langbtn{font-family:"IBM Plex Sans Hebrew",sans-serif}
.langbtn:hover{border-color:var(--deep-2)}
.menubtn{display:none;background:none;border:1px solid var(--deep-line);color:var(--deep-ink);border-radius:3px;padding:7px 10px;cursor:pointer;font:500 13.5px var(--body)}
@media (max-width:1020px){
  nav.main{display:none;position:absolute;top:100%;inset-inline:0;background:var(--deep);flex-direction:column;padding:8px clamp(16px,4vw,40px) 16px;border-bottom:1px solid var(--deep-line);gap:0}
  nav.main.open{display:flex}
  nav.main a{padding:12px 4px;border-bottom:1px solid var(--deep-line);font-size:16px}
  nav.main a[aria-current="page"]{box-shadow:none;color:var(--signal)}
  .menubtn{display:inline-block;margin-inline-start:auto}
}

/* ---------- shared blocks ---------- */
.band{background:var(--deep);color:var(--deep-ink);position:relative;overflow:hidden}
.band::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--deep-line) 1px,transparent 1px),linear-gradient(90deg,var(--deep-line) 1px,transparent 1px);background-size:56px 56px;opacity:.35;mask-image:linear-gradient(to bottom,#000,transparent 85%);-webkit-mask-image:linear-gradient(to bottom,#000,transparent 85%);pointer-events:none}
.band > .wrap{position:relative}
.bgv{position:absolute;inset:0;pointer-events:none}
.bgv video,.bgv img{width:100%;height:100%;object-fit:cover;display:block}
.bgv::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,20,34,.78),rgba(8,20,34,.86))}
.hero .bgv::after{background:linear-gradient(90deg,rgba(8,20,34,.92) 0%,rgba(8,20,34,.8) 55%,rgba(8,20,34,.62) 100%)}
html[dir="rtl"] .hero .bgv::after{background:linear-gradient(270deg,rgba(8,20,34,.92) 0%,rgba(8,20,34,.8) 55%,rgba(8,20,34,.62) 100%)}
.global-band .bgv{opacity:.55}
@media (max-width:900px){.hero .bgv::after,html[dir="rtl"] .hero .bgv::after{background:rgba(8,20,34,.84)}}
.band .eyebrow{color:var(--deep-2)}
.pagehead .wrap{padding-block:56px 48px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--deep-2);margin-bottom:18px}
.crumbs a{color:var(--deep-2);text-decoration:none}
.crumbs a:hover{color:var(--deep-ink);text-decoration:underline}
.crumbs span[aria-hidden]{opacity:.6}
.pagehead h1{font-size:clamp(30px,4.6vw,50px);max-width:24ch}
.pagehead .sub{color:var(--deep-2);margin-top:14px;max-width:66ch;font-size:17px}
section.sec{padding-block:80px}
section.sec + section.sec{border-top:1px solid var(--line)}
.sechead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:40px;align-items:end;margin-bottom:40px}
.sechead h2{font-size:clamp(28px,3.6vw,40px);margin-top:14px}
.sechead p{color:var(--ink-2);max-width:62ch}
@media (max-width:780px){.sechead{grid-template-columns:1fr;gap:14px}section.sec{padding-block:60px}}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:3px;font:600 15px var(--body);text-decoration:none;border:1px solid transparent;cursor:pointer;line-height:1.2}
.btn.primary{background:var(--signal);color:var(--signal-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:var(--deep-line);color:var(--deep-ink)}
.btn.ghost:hover{border-color:var(--deep-2)}
.btn.line{border-color:var(--line);color:var(--ink);background:var(--surface)}
.btn.line:hover{border-color:var(--ink-2)}
.arrow{display:inline-block;transition:transform .15s}
html[dir="rtl"] .arrow{transform:scaleX(-1)}
a:hover .arrow{transform:translateX(3px)}
html[dir="rtl"] a:hover .arrow{transform:scaleX(-1) translateX(3px)}
.more{display:inline-flex;gap:6px;align-items:center;color:var(--teal);font-weight:600;font-size:14.5px;text-decoration:none}
.more:hover{text-decoration:underline}

/* prose */
.prose{max-width:72ch}
.prose > * + *{margin-top:16px}
.prose h3{font-size:22px;margin-top:36px;font-weight:600}
.prose h3:first-child{margin-top:0}
.prose h4{font-size:17px;margin:24px 0 8px;font-weight:600}
.prose ul,.prose ol{padding:0;margin-block:16px 0;list-style:none;display:grid;gap:10px}
.prose ul li{position:relative;padding-inline-start:22px}
.prose ul li::before{content:"";position:absolute;inset-inline-start:2px;top:.72em;width:8px;height:2px;background:var(--signal)}
.prose ol{counter-reset:n}
.prose ol li{counter-increment:n;display:grid;grid-template-columns:34px 1fr;gap:4px}
.prose ol li::before{content:counter(n,decimal-leading-zero);font-family:var(--mono);font-size:13px;color:var(--signal);padding-top:3px}
.prose strong{font-weight:600}
.ph{background:color-mix(in srgb,var(--signal) 16%,transparent);border-bottom:1px dashed var(--signal);padding-inline:3px;font-family:var(--mono);font-size:.9em}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:56px;align-items:start}
.aside{position:sticky;top:96px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.card h4{font-size:13px;font-family:var(--mono);font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:12px}
html[lang="he"] .card h4{font-family:var(--body);letter-spacing:0;font-weight:600;font-size:14px}
.card ul{list-style:none;margin:0;padding:0;display:grid}
.card li a{display:block;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;font-size:14.5px}
.card li:first-child a{border-top:0;padding-top:0}
.card li a:hover{color:var(--teal)}
.card li a[aria-current="page"]{color:var(--signal);font-weight:600}
@media (max-width:900px){.layout{grid-template-columns:1fr;gap:40px}.aside{position:static}}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:22px;color:var(--ink-2);font-size:15px}

/* ---------- home ---------- */
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:56px;padding-block:84px 76px;align-items:end}
.hero h1{font-size:clamp(38px,6vw,70px);letter-spacing:-.012em;margin-block:18px 22px;max-width:15ch}
html[lang="he"] .hero h1{letter-spacing:0;max-width:16ch}
.hero .lede{font-size:18.5px;color:var(--deep-ink);max-width:56ch;opacity:.92}
.hero .lede2{color:var(--deep-2);max-width:56ch;margin-top:12px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.dossier{border:1px solid var(--deep-line);background:rgba(255,255,255,.03);padding:24px;border-radius:var(--radius)}
.dossier .tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--signal);text-transform:uppercase}
html[lang="he"] .dossier .tag{font-family:var(--body);letter-spacing:0;font-weight:600;font-size:13px}
.dossier h2{font-size:23px;margin-block:10px 2px;font-weight:600}
.dossier .role{color:var(--deep-2);font-size:14px}
.dossier dl{margin:18px 0 0;display:grid}
.dossier dl div{display:grid;grid-template-columns:78px 1fr;gap:12px;padding-block:11px;border-top:1px solid var(--deep-line);font-size:14px}
.dossier dt{font-family:var(--mono);font-size:11px;color:var(--deep-2);padding-top:2px}
html[lang="he"] .dossier dt{font-family:var(--body);font-size:12.5px}
.dossier dd{margin:0;font-weight:500}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr;padding-block:56px 48px;gap:36px}}

.stats{background:var(--surface);border-bottom:1px solid var(--line)}
.stats .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:28px 24px;border-inline-start:1px solid var(--line);display:grid;gap:6px;align-content:start}
.stat:first-child{border-inline-start:0;padding-inline-start:0}
.stat b{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:44px;line-height:1;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--ink-2);max-width:26ch}
@media (max-width:860px){.stats .wrap{grid-template-columns:repeat(2,1fr)}.stat:nth-child(3){border-inline-start:0;padding-inline-start:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:420px){.stat{padding:22px 14px}.stat b{font-size:36px}}

.intro{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:56px;align-items:start}
.intro h2{font-size:clamp(26px,3.2vw,36px);margin-block:14px 20px}
.intro .lead{font-size:17.5px;line-height:1.7}
.why{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px}
.why h3{font-size:20px;margin-bottom:6px;font-weight:600}
.why ol{list-style:none;margin:0;padding:0;counter-reset:w}
.why li{counter-increment:w;display:grid;grid-template-columns:36px 1fr;padding-block:14px;border-top:1px solid var(--line);font-size:15px}
.why li:first-child{border-top:0}
.why li::before{content:counter(w,decimal-leading-zero);font-family:var(--mono);color:var(--signal);font-size:13px;padding-top:2px}
@media (max-width:900px){.intro{grid-template-columns:1fr;gap:32px}}

.core{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.core div{background:var(--surface);padding:22px;font-size:15px;display:flex;flex-direction:column;gap:12px}
.core div span{font-family:var(--mono);font-size:12px;color:var(--teal)}
@media (max-width:980px){.core{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.core{grid-template-columns:1fr}}

.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.topic{display:flex;flex-direction:column;gap:14px;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;transition:border-color .15s,transform .15s}
.topic:hover{border-color:var(--teal)}
.topic svg{width:30px;height:30px;stroke:var(--signal);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.topic h3{font-size:19px;font-weight:600;line-height:1.25}
.topic p{font-size:14px;color:var(--ink-2)}
.topic .more{margin-top:auto}
@media (max-width:900px){.topics{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.topics{grid-template-columns:1fr}}

.global{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:56px;align-items:start}
.global .lead{font-size:17px;margin-top:18px}
.regions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.regions span{border:1px solid var(--deep-line);padding:6px 12px;border-radius:3px;font-size:14px}
.clientlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.clientlist li{border-top:1px solid var(--deep-line)}
.clientlist a,.clientlist span.n{display:flex;justify-content:space-between;gap:12px;padding-block:13px;text-decoration:none;font-size:15px}
.clientlist a:hover{color:var(--signal)}
.clientlist small{font-family:var(--mono);font-size:11px;color:var(--deep-2);padding-top:3px}
@media (max-width:900px){.global{grid-template-columns:1fr;gap:32px}}
@media (max-width:520px){.clientlist{grid-template-columns:1fr}}

.events{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.event{display:grid;gap:10px;align-content:start;padding:22px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);text-decoration:none}
.event:hover{border-color:var(--teal)}
.event time{font-family:var(--mono);font-size:12.5px;color:var(--signal);font-variant-numeric:tabular-nums}
.event h3{font-size:18px;font-weight:600;line-height:1.3}
.event p{font-size:14px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:900px){.events{grid-template-columns:1fr}}

/* ---------- lists ---------- */
.rows{display:grid;border-top:2px solid var(--ink)}
.row{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:24px;padding-block:24px;border-bottom:1px solid var(--line);text-decoration:none;align-items:start}
a.row:hover h3{color:var(--teal)}
.row .tag{font-family:var(--mono);font-size:12px;color:var(--teal);padding-top:4px;letter-spacing:.06em}
.row h3{font-size:21px;font-weight:600;line-height:1.25}
.row p{color:var(--ink-2);font-size:15px;margin-top:6px;max-width:70ch}
.row .more{padding-top:4px}
@media (max-width:700px){.row{grid-template-columns:1fr;gap:6px}.row .more{padding-top:6px}}
.logos{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:28px}
.logos div{background:var(--surface);padding:16px 18px;font-size:14.5px;display:flex;gap:12px;align-items:baseline}
.logos div::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--signal);flex-shrink:0;transform:translateY(-2px)}
@media (max-width:860px){.logos{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.logos{grid-template-columns:1fr}}
.clogo{display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:4px;flex-shrink:0;overflow:hidden}
.clogo img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
.clientlist .cn{display:flex;align-items:center;gap:12px}
.clientlist .clogo{width:52px;height:34px;padding:3px}
.row .clogo{width:120px;height:76px;padding:8px;border:1px solid var(--line)}
.logos div{align-items:center}
.logos div.has::before{display:none}
.logos .clogo{width:88px;height:58px;padding:5px;border:1px solid var(--line)}
.aside .clogo{display:flex;width:100%;height:130px;padding:18px;border:1px solid var(--line);margin-bottom:20px}

.team{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.person{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;text-decoration:none}
.person:hover{border-color:var(--teal)}
.mono-av{width:64px;height:64px;border-radius:50%;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center;font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:20px;color:var(--teal)}
.person h3{font-size:19px;font-weight:600;line-height:1.25}
.person .r{font-family:var(--mono);font-size:12px;color:var(--signal);letter-spacing:.06em;text-transform:uppercase}
html[lang="he"] .person .r{font-family:var(--body);letter-spacing:0;font-weight:600;font-size:13.5px}
.person p{font-size:14px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.person .more{margin-top:auto}
@media (max-width:900px){.team{grid-template-columns:1fr}}

.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;padding:18px 0;font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--mono);color:var(--signal);font-size:20px;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq details p{padding-bottom:18px;color:var(--ink-2);max-width:70ch}
.doc{display:flex;gap:16px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);text-decoration:none}
.doc:hover{border-color:var(--teal)}

.slide{scroll-snap-align:start;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-decoration:none;min-width:0}

.slide .vis svg{width:48px;height:48px;stroke:var(--signal);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;position:relative}

/* ---------- LinkedIn gallery, lightbox, methodology ---------- */

.threat figcaption{position:absolute;inset-inline:0;bottom:0;padding:28px 14px 12px;background:linear-gradient(transparent,rgba(8,20,34,.9));color:#fff;font-weight:600;font-size:15px}
@media (max-width:900px){.threats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pagehead .bgv{opacity:.5}
.stages .svid{margin:-24px -24px 10px;aspect-ratio:16/9;overflow:hidden;background:var(--deep)}
.postvid video,.postvid img,.stages .svid video,.stages .svid img{width:100%;height:100%;object-fit:cover;display:block}
.stages > li:last-child{border-top-color:var(--signal)}
.stag{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
html[lang="he"] .stag{font-family:var(--body);letter-spacing:0;font-weight:600;font-size:13px}
.stages h3{font-size:20px;font-weight:600;line-height:1.25}

.stages ul{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:7px;font-size:14.5px}

.mfoot{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:36px;margin-top:36px;align-items:start}

.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:30px}
.pillars > div{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;display:grid;gap:10px;align-content:start}

/* ---------- contact ---------- */

.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:grid;gap:6px}
.field label{font-size:14px;font-weight:500}
.field input,.field textarea{font:inherit;font-size:15.5px;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:3px;padding:11px 12px;width:100%}
.field input:focus,.field textarea:focus{outline:2px solid var(--teal);outline-offset:0;border-color:var(--teal)}

.direct{display:grid;gap:0}
.direct div{display:grid;grid-template-columns:90px 1fr;gap:12px;padding-block:16px;border-top:1px solid var(--line);align-items:baseline}

.social{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}

/* Saved rows predate fields added later to content.js; take those missing object keys from the defaults. Arrays are kept as saved. */
function fillMissing(v, d){
  if(!v||!d||typeof v!=="object"||typeof d!=="object"||Array.isArray(v)||Array.isArray(d)) return v;
  for(const k of Object.keys(d)){ if(!(k in v)) v[k]=JSON.parse(JSON.stringify(d[k])); else v[k]=fillMissing(v[k],d[k]); }
  return v;
}
window.fillMissing=fillMissing;

const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\[\[(.+?)\]\]/g,'<span class="ph">$1</span>');
function md(src){
  if(!src) return "";
  const out=[]; let list=null, para=[];
  const flushP=()=>{ if(para.length){ out.push("<p>"+inline(para.join(" "))+"</p>"); para=[]; } };
  const flushL=()=>{ if(list){ out.push("<"+list.t+">"+list.items.map(i=>"<li>"+inline(i)+"</li>").join("")+"</"+list.t+">"); list=null; } };
  for(const raw of src.split("\n")){
    const l=raw.trim();
    if(!l){ flushP(); flushL(); continue; }
    let m;
    if(l.startsWith("### ")){ flushP(); flushL(); out.push("<h4>"+inline(l.slice(4))+"</h4>"); }
    else if(l.startsWith("## ")){ flushP(); flushL(); out.push("<h3>"+inline(l.slice(3))+"</h3>"); }
    else if((m=l.match(/^- (.*)/))){ flushP(); if(!list||list.t!=="ul"){flushL(); list={t:"ul",items:[]};} list.items.push(m[1]); }
    else if((m=l.match(/^\d+\. (.*)/))){ flushP(); if(!list||list.t!=="ol"){flushL(); list={t:"ol",items:[]};} list.items.push(m[1]); }
    else { flushL(); para.push(l); }
  }
  flushP(); flushL();
  return out.join("");
}

function fitImg(img){
  const v=img.closest(".vis"), r=img.naturalWidth/img.naturalHeight; if(!v||!r) return;
  v.classList.toggle("wide", r>1.9); v.classList.toggle("tall", r<1.05);
}
function bindCarousels(){
  document.querySelectorAll(".slide .vis img.fg").forEach(img=>{ if(img.complete) fitImg(img); else img.addEventListener("load",()=>fitImg(img),{once:true}); });
  document.querySelectorAll(".carhead").forEach(head=>{
    const car=head.parentElement.querySelector(".car"); if(!car) return;
    const dots=[...head.parentElement.querySelectorAll(".cardots i")];
    const rtl=document.documentElement.dir==="rtl";
    const step=()=>{const f=car.querySelector(".slide");return f?f.getBoundingClientRect().width+16:300;};
    head.querySelectorAll("[data-car]").forEach(b=>b.addEventListener("click",()=>{const d=b.dataset.car==="next"?1:-1;car.scrollBy({left:(rtl?-d:d)*step()});}));
    const upd=()=>{const i=Math.round(Math.abs(car.scrollLeft)/step());dots.forEach((d,k)=>d.classList.toggle("on",k===Math.min(i,dots.length-1)));
      const max=car.scrollWidth-car.clientWidth-2; const pos=Math.abs(car.scrollLeft);
      const [p,n]=head.querySelectorAll("[data-car]"); p.disabled=pos<2; n.disabled=pos>=max;};
    car.addEventListener("scroll",()=>requestAnimationFrame(upd),{passive:true}); upd();
  });
}

      ${C.linkedin?'<p style="margin-top:12px"><a href="'+escU(C.linkedin)+'" target="_blank" rel="noopener">'+esc(u.linkedin)+'</a></p>':''}</div>
    <div><h4>${esc(u.footerAbout)}</h4><ul><li><a href="${href("about")}">${esc(L(S.about).title)}</a></li><li><a href="${href("clients")}">${esc(L(S.clients).title)}</a></li><li><a href="${href("about")}">${esc(L(S.about).mgmtTitle)}</a></li><li><a href="${href("contact")}">${esc(u.nav.contact)}</a></li></ul></div>
    <div><h4>${esc(u.footerExpertise)}</h4><ul><li><a href="${href("expertise")}">${esc(L(S.expertise).title)}</a></li><li><a href="${href("projects")}">${esc(L(S.projects).title)}</a></li><li><a href="${href("updates")}">${esc(L(S.updates).title)}</a></li></ul></div>

function route(){
  if(/access_token=|type=recovery|error_code=/.test(location.hash)){ openAdmin(); return; }
  let h=(location.hash||"").replace(/^#/,"");
  if(h.startsWith("he.")){ lang="he"; h=h.slice(3); }
  else if(h==="he"){ lang="he"; h="home"; }
  else if(h && h!=="main") { lang="en"; }
  if(!HE_ON && lang==="he"){ lang="en"; history.replaceState(null,"","#"+(h||"home")); }
  if(!h || h==="main") h="home";
  if(h!=="admin" && window.ISRA_ADMIN) window.ISRA_ADMIN.hide();
  const root=document.documentElement; root.lang=lang; root.dir=lang==="he"?"rtl":"ltr";
  try{ localStorage.setItem("it-lang",lang); }catch(e){}
  let html=null, m; curRoute=h;
  if(h==="home") html=pageHome();
  else if(h==="about") html=pageAbout();
  else if((m=h.match(/^team-(.+)$/))) html=pageTeam(m[1]);
  else if(h==="expertise") html=pageExpertise();
  else if((m=h.match(/^expertise-(.+)$/))) html=pageTopic(m[1]);
  else if(h==="clients") html=pageClients();
  else if((m=h.match(/^client-(.+)$/))) html=pageClient(m[1]);
  else if(h==="projects") html=pageProjects();
  else if((m=h.match(/^project-(.+)$/))) html=pageProject(m[1]);
  else if(h==="updates") html=pageUpdates();
  else if((m=h.match(/^event-(.+)$/))) html=pageEvent(m[1]);
  else if((m=h.match(/^post-(.+)$/))) html=pagePost(m[1]);
  else if((m=h.match(/^article-(.+)$/))) html=pageArticle(m[1]);
  else if(h==="contact") html=pageContact();
  else if(h==="privacy"||h==="accessibility"||h==="terms") html=pageLegal(h);
  else if((m=h.match(/^page-(.+)$/))) html=pageCustom(m[1]);
  else if(h==="admin"){ openAdmin(); return; }
  if(html===null){ h="home"; html=pageHome(); }
  renderChrome(h); renderA11y();
  $("#main").innerHTML=html;
  const t=$("#main h1"); document.title=(h==="home"?"IsraTeam 98":(t?t.textContent+" · IsraTeam":"IsraTeam 98"));
  $("#nav").classList.remove("open"); $("#menubtn").setAttribute("aria-expanded","false");
  bindPage();
}
function bindPage(){
  bindCarousels(); playVisible();
  const cm=$("#copymail");
  if(cm) cm.addEventListener("click",()=>{
    const u=U(), done=()=>{cm.textContent=u.copied;setTimeout(()=>cm.textContent=u.copy,1600)};
    const fb=()=>{const r=document.createRange();r.selectNodeContents($("#mail"));const s=getSelection();s.removeAllRanges();s.addRange(r)};
    try{navigator.clipboard.writeText(S.contact.email).then(done,fb)}catch(e){fb()}
  });
  const form=$("#cf");
  if(form) form.addEventListener("submit",ev=>{
    ev.preventDefault();
    const f=U().form; let first=null;
    const set=(id,msg)=>{const fld=$("#"+id).closest(".field"),err=fld.querySelector(".err"); if(msg){fld.setAttribute("data-invalid","");err.textContent=msg;err.hidden=false;$("#"+id).setAttribute("aria-invalid","true");first=first||$("#"+id);}else{fld.removeAttribute("data-invalid");err.hidden=true;$("#"+id).removeAttribute("aria-invalid");}};
    set("f-name", $("#f-name").value.trim()?"":f.errName);
    set("f-phone", $("#f-phone").value.trim()?"":f.errPhone);
    set("f-email", /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($("#f-email").value.trim())?"":f.errEmail);
    set("f-consent", $("#f-consent").checked?"":f.errConsent);
    if(first){ first.focus(); return; }
    const body=[f.name+": "+$("#f-name").value, f.company+": "+$("#f-company").value, f.phone+": "+$("#f-phone").value, f.email+": "+$("#f-email").value, "", $("#f-msg").value].join("\n");
    const done=$("#fdone"); done.textContent=f.sent; done.hidden=false;
    location.href="mailto:"+S.contact.email+"?subject="+encodeURIComponent("IsraTeam website inquiry – "+$("#f-name").value)+"&body="+encodeURIComponent(body);
  });
}

/* ---------- lightbox ---------- */
let lbs=null;
const lb=$("#lb");
function renderLB(focusSel){
  const p=lbs.p, i=lbs.i, x=L(p), t=T(), imgs=p.images||[], n=imgs.length;
  const vis = (!n && p.video) ? '<div class="lbvis">'+vid(p.video, x.title)+'</div>' : n ? '<div class="lbvis"><img src="'+escU(imgs[i])+'" alt="'+esc(x.title+(n>1?' – '+(i+1)+'/'+n:''))+'">'+(n>1?'<button type="button" class="lp" data-lb="-1" aria-label="'+esc(t.prevImg)+'"><span aria-hidden="true">←</span></button><button type="button" class="ln" data-lb="1" aria-label="'+esc(t.nextImg)+'"><span aria-hidden="true">→</span></button><span class="lbcount" dir="ltr">'+(i+1)+' / '+n+'</span>':'')+'</div>' : '';
  lb.innerHTML='<button type="button" class="lbx" data-lb="x" aria-label="'+esc(t.close)+'"><span aria-hidden="true">×</span></button><div class="lbin'+(n||p.video?'':' noimg')+'">'+vis+'<div class="lbtxt"><time>LinkedIn</time><h2 id="lbt">'+esc(x.title)+'</h2><p>'+esc(x.text)+'</p>'+postLinks(p)+'</div></div>';
  lb.querySelectorAll("video").forEach(v=>{const p=v.play(); if(p&&p.catch) p.catch(()=>{});});
  const f=focusSel&&lb.querySelector(focusSel); if(f) f.focus();
}
function lbMove(d){ const n=(lbs.p.images||[]).length; if(n<2) return; lbs.i=(lbs.i+d+n)%n; renderLB('[data-lb="'+d+'"]'); }
function openPost(id, idx){
  const p=findPost(id); if(!p || !lb || typeof lb.showModal!=="function") return false;
  lbs={p, i:Math.min(idx||0, Math.max(0,(p.images||[]).length-1))};
  renderLB(); lb.showModal(); const c=lb.querySelector(".lbx"); if(c) c.focus(); return true;
}
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-post]");
  if(a && !lb.open && openPost(a.dataset.post, +a.dataset.idx||0)) e.preventDefault();
});
if(lb){
  lb.addEventListener("click",e=>{
    if(e.target===lb) return lb.close();
    const b=e.target.closest("[data-lb]");
    if(b){ if(b.dataset.lb==="x") lb.close(); else lbMove(+b.dataset.lb); return; }
    if(e.target.closest("a")) lb.close();
  });
  lb.addEventListener("keydown",e=>{
    if(e.key!=="ArrowLeft" && e.key!=="ArrowRight") return;
    const rtl=document.documentElement.dir==="rtl"; let d=e.key==="ArrowRight"?1:-1; if(rtl) d=-d; lbMove(d);
  });
  let x0=null;
  lb.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;},{passive:true});
  lb.addEventListener("touchend",e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; x0=null; if(Math.abs(dx)>50 && e.target.closest(".lbvis")){ const rtl=document.documentElement.dir==="rtl"; let d=dx<0?1:-1; if(rtl) d=-d; lbMove(d);} },{passive:true});
}

/* ---------- accessibility menu ---------- */
const A11Y_T={
  en:{open:"Accessibility menu",title:"Accessibility",text:"Text size",smaller:"Smaller text",bigger:"Larger text",hc:"High contrast",links:"Highlight links",font:"Readable font",still:"Stop videos and animations",reset:"Reset",close:"Close accessibility menu",statement:"Accessibility statement"},
  he:{open:"תפריט נגישות",title:"נגישות",text:"גודל טקסט",smaller:"הקטנת טקסט",bigger:"הגדלת טקסט",hc:"ניגודיות גבוהה",links:"הדגשת קישורים",font:"גופן קריא",still:"עצירת סרטונים ואנימציות",reset:"איפוס",close:"סגירת תפריט הנגישות",statement:"הצהרת נגישות"}};
const A11Y_ICON='<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="4" r="2"/><path d="M20.5 7.5c-2.6.7-5.6 1-8.5 1s-5.9-.3-8.5-1l-.5 2c2 .5 4.2.9 6.5 1.1V14l-2.3 7.4 1.9.6L11.2 15h1.6l2.1 7 1.9-.6L14.5 14v-3.4c2.3-.2 4.5-.6 6.5-1.1z"/></svg>';
function applyA11y(){
  const r=document.documentElement, set=(k,v)=>v?r.setAttribute(k,v===true?"":String(v)):r.removeAttribute(k);
  set("data-size",A11Y.size||null); set("data-hc",A11Y.hc); set("data-links",A11Y.links); set("data-font",A11Y.font); set("data-still",A11Y.still);
  try{ localStorage.setItem("it-a11y",JSON.stringify(A11Y)); }catch(e){}
}
function renderA11y(){
  const t=A11Y_T[lang], b=$("#a11yb"), p=$("#a11yp");
  b.innerHTML=A11Y_ICON; b.setAttribute("aria-label",t.open); b.title=t.open;
  const tg=(k)=>'<button type="button" data-a11y="'+k+'" aria-pressed="'+A11Y[k]+'">'+esc(t[k])+'</button>';
  p.innerHTML='<h2 id="a11yt">'+esc(t.title)+'<button type="button" class="x" data-a11y="close" aria-label="'+esc(t.close)+'"><span aria-hidden="true">×</span></button></h2>'+
    '<div class="sz" role="group" aria-label="'+esc(t.text)+'"><span>'+esc(t.text)+' <b dir="ltr">'+(innerWidth<=600?[100,108,115,120]:[100,112,125,140])[A11Y.size]+'%</b></span><button type="button" data-a11y="dec" aria-label="'+esc(t.smaller)+'"'+(A11Y.size?'':' disabled')+'>A−</button><button type="button" data-a11y="inc" aria-label="'+esc(t.bigger)+'"'+(A11Y.size<3?'':' disabled')+'>A+</button></div>'+
    '<div class="grid">'+tg("hc")+tg("links")+tg("font")+tg("still")+'</div>'+
    '<div class="foot"><button type="button" data-a11y="reset">'+esc(t.reset)+'</button><a href="'+href("accessibility")+'">'+esc(t.statement)+'</a></div>';
}
function a11yOpen(o){ const b=$("#a11yb"), p=$("#a11yp"); p.hidden=!o; b.setAttribute("aria-expanded",String(o)); if(o){ const f=p.querySelector("[data-a11y]:not(.x):not(:disabled)"); if(f) f.focus(); } }
$("#a11yb").addEventListener("click",()=>a11yOpen($("#a11yp").hidden));
$("#a11yp").addEventListener("click",e=>{
  if(e.target.closest("a")){ a11yOpen(false); return; }
  const b=e.target.closest("[data-a11y]"); if(!b) return; const k=b.dataset.a11y;
  if(k==="close"){ a11yOpen(false); $("#a11yb").focus(); return; }
  const wasStill=REDUCED;
  if(k==="inc") A11Y.size=Math.min(3,A11Y.size+1);
  else if(k==="dec") A11Y.size=Math.max(0,A11Y.size-1);
  else if(k==="reset"){ A11Y.size=0; A11Y.hc=A11Y.links=A11Y.font=A11Y.still=false; }
  else A11Y[k]=!A11Y[k];
  applyA11y(); REDUCED=SYS_REDUCED||A11Y.still;
  if(REDUCED!==wasStill){ const y=scrollY; route(); scrollTo(0,y); }
  renderA11y(); const again=$('#a11yp [data-a11y="'+k+'"]'); (again&&!again.disabled?again:$("#a11yp .x")).focus();
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !$("#a11yp").hidden){ a11yOpen(false); $("#a11yb").focus(); } });
document.addEventListener("click",e=>{ if(e.target.isConnected && !$("#a11yp").hidden && !e.target.closest("#a11yp,#a11yb")) a11yOpen(false); });
applyA11y();

if(!location.hash && HE_ON){ try{ if(localStorage.getItem("it-lang")==="he") lang="he"; }catch(e){} if(lang==="he") history.replaceState(null,"","#he.home"); }
{ let done=false; const go=()=>{ if(!done){ done=true; route(); } };
